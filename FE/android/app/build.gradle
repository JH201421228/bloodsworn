apply plugin: 'com.android.application'

// T720 — 릴리스 서명.
//   key.properties 는 절대 커밋하지 않는다(루트 .gitignore 43~44행).
//   파일이 없으면 signingConfig 자체를 붙이지 않아 debug 서명으로 fallback 한다 →
//   CI/동료 환경에서 `assembleDebug` 가 키 없이도 그냥 돌아간다.
// ═══════════════════════════════════════════════════════════════════════════
//  T243 — versionCode 자동 증가 (Android)
//
//  ★ 왜 이게 여기 있나
//    iOS 는 CI 가 빌드 카운터를 주입한다 — codemagic.yaml 의 "빌드 번호 결정" 스텝
//    (`agvtool new-version -all $BUILD_NUMBER`) 과 .github/workflows/ios-testflight.yml
//    의 `agvtool new-version -all ${{ github.run_number }}` 가 그것이다.
//    Android 는 릴리스 AAB 를 이 PC 에서 굽는 구조라 그런 카운터가 없다.
//    그래서 같은 역할을 이 자리에서 한다 — version.properties 를 +1 하고 되쓴다.
//
//  ★ 언제 올라가나 — **릴리스 산출물을 만드는 태스크를 요청했을 때만**이다.
//    `assembleDebug` 를 하루에 50번 돌려도 versionCode 는 움직이지 않는다.
//    (개발 중에 versionCode 가 수천이 되는 사고를 막는다.)
//
//  ★ 절대 규칙 — 한 번 올린 값보다 낮아지지 않는다.
//    Play 는 이미 쓴 versionCode 의 재사용도 감소도 거부한다. 아래 계산은
//    어떤 입력이 들어와도 저장값보다 작은 값을 내지 않는다. CI 카운터가 리셋돼
//    작은 수가 주입돼도 저장값 +1 로 올라간다.
//
//  ★ 탈출구 2개
//    -PskipVersionBump       … 같은 versionCode 로 릴리스를 재현할 때(증가 없음)
//    ANDROID_VERSION_CODE=N  … CI 가 자체 빌드 카운터를 주입할 때(환경변수)
//                              -PandroidVersionCode=N 도 같은 뜻이다
//
//  ⚠ 빌드가 실패해도 올라간 값은 되돌리지 않는다. versionCode 에 구멍(1,2,5…)이
//    나는 것은 Play 가 허용한다. 되돌리다 같은 값을 두 번 쓰는 쪽이 훨씬 위험하다.
//  ⚠ 이 파일이 바뀌면 **반드시 커밋한다.** 커밋하지 않으면 다음 빌드가 같은 값에서
//    다시 시작해 "이미 사용된 버전 코드" 에러로 돌아온다.
// ═══════════════════════════════════════════════════════════════════════════
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))

def storedVersionCode = versionProps['versionCode'].toString().trim().toInteger()

// :app:bundleRelease / assembleRelease / installRelease / publish…Release 를 모두 잡는다.
def releaseTaskPattern = ~/(?i).*(assemble|bundle|install|publish)Release.*/
def wantsRelease = gradle.startParameter.taskNames.any { it ==~ releaseTaskPattern }
def skipBump = project.hasProperty('skipVersionBump')
def injectedRaw = System.getenv('ANDROID_VERSION_CODE') ?: project.findProperty('androidVersionCode')

def resolvedVersionCode = storedVersionCode
def bumpReason = null

if (injectedRaw != null && injectedRaw.toString().trim()) {
    def injected = injectedRaw.toString().trim().toInteger()
    resolvedVersionCode = injected > storedVersionCode ? injected : storedVersionCode + 1
    bumpReason = "CI 주입 (ANDROID_VERSION_CODE=" + injected + ")"
} else if (wantsRelease && !skipBump) {
    resolvedVersionCode = storedVersionCode + 1
    bumpReason = "릴리스 태스크 자동 증가"
}

if (resolvedVersionCode != storedVersionCode) {
    // Properties.store() 를 쓰면 한국어 주석이 유니코드 이스케이프로 깨지고 순서도 뒤집힌다.
    // versionCode= 줄 하나만 갈아끼운다.
    def out = []
    versionPropsFile.eachLine('UTF-8') { line ->
        out << (line.trim().startsWith('versionCode=') ? ('versionCode=' + resolvedVersionCode) : line)
    }
    versionPropsFile.write(out.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    logger.lifecycle("[T243] versionCode " + storedVersionCode + " -> " + resolvedVersionCode
        + " (" + bumpReason + ") — version.properties 가 갱신됐다. ★ 이 변경을 커밋하라.")
} else if (wantsRelease) {
    logger.lifecycle("[T243] versionCode " + resolvedVersionCode + " 유지 (-PskipVersionBump).")
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.bloodsworn.game"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.bloodsworn.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode          // ↑ T243 블록이 계산한다
        versionName versionProps['versionName']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // ★ minifyEnabled false 를 유지한다.
            //   게임 로직은 전부 WebView 안 JS 라 R8 이 줄일 자바 코드가 거의 없다.
            //   반면 Capacitor 브리지는 리플렉션으로 플러그인을 찾으므로 난독화가 깨지기 쉽다.
            //   얻는 것 대비 릴리스 전용 크래시 위험이 커서 켜지 않는다.
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 릴리스 서명 빌드를 지운 뒤에야 디버그를 깔 수 있는 상황을 없앤다.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    // AAB 분할. Play 가 기기별로 필요한 조각만 내려보낸다.
    bundle {
        language { enableSplit = false }  // 앱 내 한국어 문자열뿐이라 언어 분할은 이득이 없다
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }

    packagingOptions {
        // 웹 에셋(png/json)은 이미 최적화돼 있다. aapt 재압축은 시간만 먹고 크기는 되레 늘 수 있다.
        jniLibs { useLegacyPackaging = false }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
