# BLOODSWORN 버전 단일 진실원천 (Android) — 14-BUILD-AND-DEPLOY.md §11.1
#
# ★ T243 완료 — versionCode 는 이제 손으로 올리지 않는다.
#   app/build.gradle 상단 [T243] 블록이 **릴리스 태스크를 요청했을 때만**
#   이 파일의 versionCode 를 +1 하고 되쓴다(`bundleRelease` / `assembleRelease` 등).
#   `assembleDebug` 는 이 값을 건드리지 않는다.
#
#   - 값이 바뀌면 ★ 반드시 커밋한다. 커밋하지 않으면 다음 빌드가 같은 값에서
#     다시 시작해 Play 의 "이미 사용된 버전 코드" 에러로 돌아온다.
#   - 같은 versionCode 로 릴리스를 재현해야 하면 `-PskipVersionBump` 를 준다.
#   - CI 에서 자체 빌드 카운터를 쓰려면 환경변수 `ANDROID_VERSION_CODE=N`
#     (또는 `-PandroidVersionCode=N`). 저장값보다 작으면 저장값 +1 로 보정된다.
#   - 손으로 고쳐도 된다. 단 **한 번 올린 값보다 낮출 수는 없다** — Play 가 거부한다.
#
# ★ versionName 은 iOS 의 MARKETING_VERSION(project.pbxproj) 과 손으로 맞춘다.
#   versionCode 와 iOS CURRENT_PROJECT_VERSION 은 맞추려고 애쓰지 않는다(§11.2).
#
# ⚠ 문서 간 값 충돌이 있다. 아래는 12-TASK-BACKLOG T741(`v1.0.0` 태그)을 채택한 값이다.
#   14-BUILD-AND-DEPLOY §11.1 은 Day 7 내부테스트를 0.1.1/2 로 잡는다.
versionCode=1
versionName=1.0.0
