<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <!--
            viewport-fit=cover  노치 영역까지 캔버스를 채운다. 없으면 좌우에 검은 띠가 생긴다.
            user-scalable=no    게임 중 핀치 줌 방지.
            규격: 06-TECH-DESIGN.md 11.3
        -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0b0710" />
        <title>BLOODSWORN · 피의 서약</title>

        <!--
            ── 치명 오류 화면의 스타일 (F-1) ────────────────────────────────
            ★ 왜 index.css 가 아니라 여기 인라인인가
              index.css 는 main.jsx 가 import 한다. 즉 **번들이 살아 있을 때만** 적용된다.
              번들이 아예 안 뜨는 사고(청크 404 / 문법 에러 / import 실패)가 바로
              흰 화면의 대표 원인인데, 그때 index.css 로 짠 화면은 스타일 없는
              흰 배경의 맨 글자로 뜬다. 최종 방어선은 자기 스타일을 스스로 들고 있어야 한다.
            ★ 같은 이유로 --u / --void / base_font 같은 index.css 자산을 하나도 쓰지 않는다.
              색은 리터럴, 폰트는 시스템 고정폭, 크기는 뷰포트 단위로만 짠다.
            ★ 가로 전용이라 vh 를 기준으로 잡는다(논리 세로 360 이 어떤 기기에서도 불변).
        -->
        <style>
            #fatal {
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                padding: max(env(safe-area-inset-top, 0px), 2vh)
                    max(env(safe-area-inset-right, 0px), 3vh)
                    max(env(safe-area-inset-bottom, 0px), 2vh)
                    max(env(safe-area-inset-left, 0px), 3vh);
                background: #0b0710;
                color: #c9b792;
                font-family: ui-monospace, "Courier New", monospace;
                line-height: 1.5;
                overflow: hidden;
                -webkit-tap-highlight-color: transparent;
            }
            /* [hidden] 은 display:flex 에 지므로 명시적으로 이긴다 */
            #fatal[hidden] {
                display: none;
            }
            #fatal * {
                box-sizing: border-box;
            }
            .fatal__box {
                width: 100%;
                max-width: 96vh;
                text-align: center;
                font-size: clamp(11px, 3vh, 20px);
            }
            .fatal__mark {
                margin: 0;
                color: #8b0f1d;
                font-size: 1.8em;
                line-height: 1;
            }
            .fatal__title {
                margin: 0.4em 0 0;
                color: #c4182b;
                font-size: 1.35em;
                font-weight: 400;
                letter-spacing: 0.08em;
            }
            .fatal__body {
                margin: 0.6em 0 0;
                color: #c9b792;
                font-size: 0.95em;
            }
            /* 「저장하지 않았다」는 이 화면에서 가장 중요한 한 줄이다. 촛불색으로 안심시킨다. */
            .fatal__safe {
                margin: 0.5em 0 0;
                color: #35c9b4;
                font-size: 0.8em;
            }
            .fatal__acts {
                display: flex;
                flex-wrap: wrap;
                gap: 0.7em;
                justify-content: center;
                margin-top: 1.2em;
            }
            .fatal__btn {
                min-width: 11em;
                min-height: 2.6em;
                padding: 0.5em 1.2em;
                color: #c9b792;
                background: #16121c;
                border: 1px solid #4a4454;
                font-family: inherit;
                font-size: 0.9em;
                cursor: pointer;
            }
            .fatal__btn--primary {
                color: #8ff0dc;
                border-color: #1e7e74;
            }
            .fatal__btn[hidden] {
                display: none;
            }
            .fatal__more {
                margin-top: 1em;
                padding: 0.2em 0.6em;
                color: #7b7488;
                background: none;
                border: none;
                font-family: inherit;
                font-size: 0.7em;
                text-decoration: underline;
                cursor: pointer;
            }
            .fatal__detail {
                max-height: 26vh;
                margin: 0.4em 0 0;
                padding: 0.6em;
                overflow: auto;
                color: #9a94a3;
                background: #16121c;
                border: 1px solid #2a2533;
                font-size: 0.62em;
                line-height: 1.35;
                text-align: left;
                white-space: pre-wrap;
                word-break: break-all;
                /* 이 블록만 스크롤을 허용한다 — 전역 touch-action:none 과 무관하게 읽을 수 있어야 한다 */
                touch-action: pan-y;
                -webkit-user-select: text;
                user-select: text;
            }
            .fatal__detail[hidden] {
                display: none;
            }
        </style>
    </head>
    <!-- 배경을 여기 박는 이유: React 마운트 전 1~2초 동안 흰 화면이 뜬다.
         어두운 게임에서 흰 섬광은 로딩이 아니라 고장으로 읽힌다. -->
    <body style="background:#0b0710">
        <div id="root"></div>

        <!--
            ── 치명 오류 화면 (F-1) ──────────────────────────────────────
            ★ React 로 그리지 않는다. 이 화면이 필요한 순간은 정의상 「React 트리가 죽은 순간」이고,
              죽은 트리로 죽음을 알릴 수는 없다. 정적 DOM 은 번들이 통째로 실패해도 살아 있다.
              근거와 실측: docs/06-TECH-DESIGN.md 16장
            ★ hidden 으로 시작한다. 평소에는 DOM 에 있을 뿐 아무 일도 하지 않는다.
        -->
        <div id="fatal" hidden>
            <div class="fatal__box">
                <p class="fatal__mark">✚</p>
                <h1 class="fatal__title">의식이 끊겼다</h1>
                <p class="fatal__body">
                    예상치 못한 문제로 게임이 멈췄다.<br />
                    모아 둔 골드와 성소 진행도는 그대로 남아 있다.
                </p>
                <p class="fatal__safe">이 상태는 저장하지 않았다.</p>
                <div class="fatal__acts">
                    <button id="fatal-back" type="button" class="fatal__btn fatal__btn--primary" hidden>
                        타이틀로 돌아가기
                    </button>
                    <button id="fatal-reload" type="button" class="fatal__btn">앱 다시 시작</button>
                </div>
                <button id="fatal-more" type="button" class="fatal__more">자세히</button>
                <pre id="fatal-detail" class="fatal__detail" hidden></pre>
            </div>
        </div>

        <!--
            ── 최종 방어선 (F-1) ─────────────────────────────────────────
            ★ 번들보다 **먼저**, 번들과 **무관하게** 돌아야 한다. 그래서
              type="module" 이 아니고(모듈은 defer 라 번들과 같은 시점에 실행된다),
              import 도 없고, ES5 문법만 쓴다(빌드 타깃 chrome87/safari14 아래로도 내려간다).
            ★ 하는 일은 셋뿐이다: 저장 잠그기 · logcat 에 남기기 · 이 화면 띄우기.
              그 이상(스토어 되돌리기 · 씬 정리)은 번들이 살아 있을 때만 가능하므로
              번들 쪽이 uiRecover / gameRecover 를 여기에 꽂아 주는 구조다.
        -->
        <script>
            (function () {
                "use strict";

                /** 같은 오류가 매 프레임 쏟아질 때 logcat 을 채우지 않기 위한 상한 */
                var MAX_LOG = 3;

                var api = {
                    /** 화면이 이미 떠 있는가. 두 번째부터는 세기만 한다(반복 예외 방어) */
                    shown: false,
                    /** 부팅 이후 누적 보고 수 */
                    count: 0,
                    /** 「타이틀로 돌아가기」를 몇 번 눌렀는가 */
                    recovers: 0,
                    /** 마지막 복구 시각. 「복구 직후 또 죽었는가」를 판정하는 근거다 */
                    recoveredAt: 0,
                    /** 마지막 보고 내용(디버그용). 세이브 내용은 절대 들어가지 않는다 */
                    last: null,
                    /** 번들이 꽂아 주는 훅. 없으면 「앱 다시 시작」만 제공한다 */
                    sink: null,
                    uiRecover: null,
                    gameRecover: null
                };
                window.__BSW_FATAL__ = api;

                function el(id) {
                    return document.getElementById(id);
                }

                function log() {
                    // console 자체가 없는 WebView 도 있다. 로그 때문에 죽으면 본말전도다.
                    try {
                        console.error.apply(console, arguments);
                    } catch (e) {
                        /* 무시 */
                    }
                }

                function textOf(err) {
                    if (err === null || err === undefined) return "(내용 없음)";
                    if (typeof err === "string") return err;
                    var name = err.name ? err.name + ": " : "";
                    var msg = err.message !== undefined ? err.message : String(err);
                    return name + msg;
                }

                function stackOf(err) {
                    if (!err || !err.stack) return "";
                    // 8줄이면 원인 지점을 짚기에 충분하다. 전부 실으면 화면과 로그가 넘친다.
                    return String(err.stack).split("\n").slice(0, 8).join("\n");
                }

                function paint(info) {
                    var root = el("fatal");
                    if (!root) return;
                    var d = el("fatal-detail");
                    if (d) {
                        d.textContent =
                            info.kind +
                            " · " +
                            info.message +
                            (info.where ? "\n@ " + info.where : "") +
                            (info.stack ? "\n" + info.stack : "");
                    }
                    // 소프트 복구는 「번들이 살아 있고 + 게임 루프도 살아 있음이 증명될 때」만 권한다.
                    // gameRecover 는 루프 가드가 꽂아 준다. 가드가 예외를 삼켰다는 사실 자체가
                    // rAF 체인이 아직 돈다는 증거다(Phaser 의 rAF 는 콜백이 던지면 다음 프레임을
                    // 예약하지 못하고 영원히 멈춘다 — dom/RequestAnimationFrame.js 실측).
                    // 가드가 없으면 루프가 이미 끊겼을 수 있고, 그때 타이틀로 돌아가 봐야
                    // 멈춘 화면만 남는다. 그럴 땐 재시작만 제시하는 편이 정직하다.
                    //
                    // ★ 반복 판정은 「횟수」가 아니라 「간격」이다.
                    //   횟수로만 막으면, 복구해서 한참 잘 놀다가 한 시간 뒤에 난 무관한 오류에도
                    //   진행도를 지키는 선택지가 사라진다. 우리가 막고 싶은 것은 그게 아니라
                    //   「눌렀는데 곧바로 또 죽는」 왕복이다. 그래서 10초 안에 재발한 경우만 감춘다.
                    //   그래도 끝없이 오가지 않도록 3회를 상한으로 둔다.
                    var tooSoon = api.recoveredAt > 0 && Date.now() - api.recoveredAt < 10000;
                    var back = el("fatal-back");
                    if (back) {
                        back.hidden =
                            !(api.uiRecover && api.gameRecover) || tooSoon || api.recovers >= 3;
                    }
                    root.hidden = false;
                }

                /**
                 * 모든 치명 오류의 단일 관문.
                 * @param {string} kind  window / promise / react / game
                 * @param {*} err
                 * @param {string} [where]
                 */
                api.report = function (kind, err, where) {
                    api.count += 1;
                    var info = {
                        kind: kind || "unknown",
                        message: textOf(err),
                        stack: stackOf(err),
                        where: where || "",
                        count: api.count
                    };
                    api.last = info;

                    // ★ 화면보다 먼저 건다. 이 한 줄이 「깨진 상태를 저장하지 않는다」의 실체다.
                    window.__BSW_SAVE_LOCKED__ = true;

                    if (api.count <= MAX_LOG) {
                        log(
                            "[치명] " +
                                info.kind +
                                " | " +
                                info.message +
                                (info.where ? " @ " + info.where : "") +
                                (info.stack ? "\n" + info.stack : "")
                        );
                    } else if (api.count === MAX_LOG + 1) {
                        log("[치명] 같은 오류가 반복된다. 이후 로그는 생략한다.");
                    }

                    // 화면과 통보는 **첫 보고에만** 한다. 매 프레임 던지는 예외에 대해
                    // DOM 을 다시 만지거나 이벤트를 다시 쏘면 그것이 곧 두 번째 사고가 된다.
                    if (!api.shown) {
                        api.shown = true;
                        paint(info);
                        if (api.sink) {
                            try {
                                api.sink(info);
                            } catch (e) {
                                log("[치명] sink 실패", e);
                            }
                        }
                    }
                    return info;
                };

                api.restart = function () {
                    try {
                        window.location.reload();
                    } catch (e) {
                        window.location.href = window.location.href;
                    }
                };

                /** 진행도를 지키는 쪽. 실패하면 재시작으로 정직하게 떨어진다. */
                api.recover = function () {
                    api.recovers += 1;
                    try {
                        if (api.gameRecover) api.gameRecover();
                    } catch (e) {
                        log("[치명] 게임 정리 실패", e);
                    }
                    var ok = false;
                    try {
                        ok = api.uiRecover ? api.uiRecover() !== false : false;
                    } catch (e) {
                        log("[치명] 화면 복구 실패", e);
                    }
                    if (!ok) {
                        api.restart();
                        return;
                    }
                    api.shown = false;
                    api.count = 0;
                    api.recoveredAt = Date.now();
                    var root = el("fatal");
                    if (root) root.hidden = true;
                    var d = el("fatal-detail");
                    if (d) d.hidden = true;
                    var more = el("fatal-more");
                    if (more) more.textContent = "자세히";
                };

                // ── 전역 예외 두 갈래 ────────────────────────────────────
                // ★ 번들이 살아 있으면 fatal.js 가 sink 를 꽂아 EventBus 로도 흘려보낸다.
                //   번들이 죽어 있어도 이 두 줄만으로 화면은 뜬다.
                window.addEventListener(
                    "error",
                    function (ev) {
                        // 리소스 로드 실패는 target 이 붙은 이벤트로 온다.
                        // ★ 그중 <script> 만 치명이다. 이미지·오디오 하나가 없다고 게임을 죽이지 않는다.
                        //   반대로 번들 스크립트가 안 뜨는 것은 흰 화면의 대표 원인 그 자체다.
                        if (ev && ev.target && ev.target !== window) {
                            var t = ev.target;
                            if (t.tagName === "SCRIPT") {
                                api.report("resource", "스크립트를 불러오지 못했다", t.src || "");
                            }
                            return;
                        }
                        api.report(
                            "window",
                            ev && ev.error ? ev.error : ev && ev.message,
                            ev && ev.filename ? ev.filename + ":" + ev.lineno : ""
                        );
                    },
                    // ★ capture:true 가 필수다. 리소스 로드 오류는 버블링하지 않는다 —
                    //   캡처 단계로 듣지 않으면 window 까지 오지 않는다.
                    true
                );

                // ── 부팅 감시견 ────────────────────────────────────────
                // ★ 위 두 핸들러는 「던져진 예외」만 잡는다. 아무 예외도 없이 그냥 안 그려지는
                //   경우(청크가 조용히 실패, 부팅이 매달림)는 어떤 핸들러에도 안 걸리고
                //   그대로 흰 화면이 된다. 화면이 비었다는 사실 자체를 근거로 삼는다.
                // ★ 15초는 넉넉하다 — React 는 번들이 평가되는 즉시 로딩 화면을 그리므로
                //   에셋 로딩 속도와 무관하다. 저사양 기기의 번들 파싱도 이보다 훨씬 짧다.
                window.setTimeout(function () {
                    if (api.shown) return;
                    var root = el("root");
                    if (root && root.children.length > 0) return;
                    api.report("boot", "화면을 그리지 못했다(15초 경과)");
                }, 15000);
                window.addEventListener("unhandledrejection", function (ev) {
                    api.report("promise", ev && ev.reason);
                });

                // ── 버튼 ────────────────────────────────────────────────
                var back = el("fatal-back");
                if (back) {
                    back.addEventListener("click", function () {
                        api.recover();
                    });
                }
                var reload = el("fatal-reload");
                if (reload) {
                    reload.addEventListener("click", function () {
                        api.restart();
                    });
                }
                var more = el("fatal-more");
                if (more) {
                    more.addEventListener("click", function () {
                        var d = el("fatal-detail");
                        if (!d) return;
                        d.hidden = !d.hidden;
                        more.textContent = d.hidden ? "자세히" : "접기";
                    });
                }
            })();
        </script>

        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
